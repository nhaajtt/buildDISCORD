x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  bot:
    build: .
    image: thauxaydung:local
    container_name: thauxaydung
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATA_DIR: /data
      DASHBOARD_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/data

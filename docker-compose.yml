x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  bot:
    build: .
    image: thauxaydung:local
    container_name: thauxaydung
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
